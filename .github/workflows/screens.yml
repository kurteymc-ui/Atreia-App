name: Screens

# Draws the meter's main windows with sample data (the app's own render-* modes, no window is shown) after every change to
# the app, and puts the pictures on the "screens" branch, so the look can be checked without a Windows PC.
on:
  push:
    branches: [main]
    paths: ["Client/**", ".github/workflows/screens.yml"]

permissions:
  contents: write

concurrency:
  group: screens
  cancel-in-progress: true

jobs:
  screens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Client/AionDPS.csproj -c Release --nologo -o out
      - name: Draw the windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory screens | Out-Null
          $exe = (Resolve-Path out/AtreiaApp.exe).Path
          $shots = @(
            @('render-overlay', 'window.png', 'window'),
            @('render-overlay', 'compact.png', 'compact'),
            @('render-overlay', 'compact-rdps.png', 'rdps'),
            @('render-overlay', 'compact-crowd.png', 'crowd'),
            @('render-overlay', 'bar.png', 'bar'),
            @('render-overlay', 'dummy.png', 'dummy'),
            @('render-overlay', 'find.png', 'find'),
            @('render-overlay', 'bossbar.png', 'bossbar'),
            @('render-overlay', 'stagger.png', 'stagger'),
            @('render-overlay', 'stagger-failed.png', 'stagger-failed'),
            @('render-overlay', 'stagger-tip.png', 'stagger-tip'),
            @('render-overlay', 'findservers.png', 'findservers'),
            @('render-player', 'player.png', 'en'),
            @('render-overlay', 'tools.png', 'tools'),
            @('render-overlay', 'chips.png', 'chips'),
            @('render-overlay', 'menu.png', 'menu'),
            @('render-overlay', 'menu-dummy.png', 'menu-dummy'),
            @('render-overlay', 'callout.png', 'callout'),
            @('render-overlay', 'look-wide.png', 'look-wide'),
            @('render-overlay', 'look-thread.png', 'look-thread'),
            @('render-overlay', 'look-frame.png', 'look-frame'),
            @('render-overlay', 'look-raidlog.png', 'look-raidlog'),
            @('render-overlay', 'look-minimal.png', 'look-minimal'),
            @('render-overlay', 'look-oldschool.png', 'look-oldschool'),
            @('render-checklist', 'roster.png', 'roster'),
            @('render-app', 'app-home.png', 'home'),
            @('render-app', 'app-home-full.png', 'home', '1300'),
            @('render-app', 'app-news.png', 'news', '1250'),
            @('render-app', 'app-journey.png', 'journey', '1900'),
            @('render-app', 'app-legion.png', 'legion', '1500'),
            @('render-app', 'app-status.png', 'status'),
            @('render-app', 'app-updates.png', 'updates'),
            @('render-app', 'app-updates-open.png', 'updates-open', '900'),
            @('render-app', 'app-stream.png', 'stream'),
            @('render-app', 'app-bosses.png', 'boss', '1400'),
            @('render-app', 'app-overlays.png', 'overlays'),
            @('render-app', 'app-characters.png', 'characters'),
            @('render-app', 'app-history.png', 'history'),
            @('render-app', 'app-meter.png', 'meter'),
            @('render-app', 'app-cubes.png', 'cubes'),
            @('render-app', 'app-timers.png', 'timetable'),
            @('render-app', 'app-timers-full.png', 'timetable', '2100'),
            @('render-tool', 'timers-overlay.png', 'timetable-overlay'),
            @('render-tool', 'blackcloud-marks.png', 'blackcloud-marks'),
            @('render-tool', 'hotkeys.png', 'hotkeys'),
            @('render-tool', 'hotkeys-problems.png', 'hotkeys-problems'),
            @('render-tool', 'overlay-menu.png', 'overlay-menu'),
            @('render-tool', 'overlay-button.png', 'overlay-button'),
            @('render-network', 'network.png', '2'),
            @('render-tool', 'setup-design.png', 'setup-design'),
            @('render-tool', 'setup-columns.png', 'setup-columns'),
            @('render-tool', 'setup-overlays.png', 'setup-overlays'),
            @('render-tool', 'setup-map.png', 'setup-map'),
            @('render-tool', 'setup-colours.png', 'setup-colours-midnight'),
            @('render-petmap', 'petmap-route.png', 'altgard', '20000', '30000', 'route'),
            @('render-petmap', 'petmap-route-round.png', 'altgard', '20000', '30000', 'route-round'),
            @('render-petmap', 'petmap-route-whole.png', 'altgard', '20000', '30000', 'route-whole'),
            @('render-assist', 'assist-window.png', 'en'),
            @('render-assist', 'assist-buffs.png', 'buffs'),
            @('render-assist', 'assist-overlays.png', 'overlays'),
            @('render-petmap', 'petmap-route-whole-v.png', 'verteron', '-215789', '262953', 'route-whole'),
            @('render-petmap', 'petmap-eltnen.png', 'eltnen', '0', '0', 'route-whole'),
            @('render-petmap', 'petmap-morheim.png', 'morheim', '0', '0', 'route-whole'),
            @('render-petmap', 'petmap-reshanta-middle.png', 'reshanta-middle', '0', '0', 'route-whole'),
            @('render-petmap', 'petmap-reshanta-upper.png', 'reshanta-upper', '0', '0', 'route-whole'),
            @('render-app', 'app-meterlook.png', 'meterlook'),
            @('render-app', 'app-petmap.png', 'petmap'),
            @('render-app', 'app-pets.png', 'petmap.pets'),
            @('render-app', 'app-pets-long.png', 'petmap.pets', '2000'),
            @('render-app', 'app-gather.png', 'petmap.gather'),
            @('render-checklist', 'checklist.png', 'character'),
            @('render-checklist', 'checklist-season.png', 'character-season'),
            @('render-checklist', 'checklist-supply.png', 'character-supply'),
            @('render-checklist', 'checklist-inventory.png', 'character-inventory'),
            @('render-details', 'details-skills.png', 'skills'),
            @('render-details', 'details-buffs.png', 'buffs'),
            @('render-loot', 'loot.png', 'en'),
            @('render-cpcalc', 'cpcalc.png', 'en', 'gear'),
            @('render-cpcalc', 'cpcalc-stigmas.png', 'en', 'stigmas'),
            @('render-cpcalc', 'cpcalc-skills.png', 'en', 'skills'),
            @('render-cpcalc', 'cpcalc-genus.png', 'en', 'genus'),
            @('render-cpcalc', 'cpcalc-pets.png', 'en', 'pets'),
            @('render-cpcalc', 'cpcalc-daevanion.png', 'en', 'daevanion'),
            @('render-cpcalc', 'cpcalc-titles.png', 'en', 'titles'),
            @('render-cpcalc', 'cpcalc-arcana.png', 'en', 'arcana'),
            @('render-cpcalc', 'cpcalc-check.png', 'en', 'check'),
            @('render-gather', 'gather-overlay.png', 'en'),
            @('render-season', 'season-overlay.png', 'en'),
            @('render-settings', 'settings.png', 'Interface'),
            @('render-report', 'report-damage.png', 'Damage'),
            @('render-report', 'report-healing.png', 'Healing'),
            @('render-report', 'report-taken.png', 'Damage-taken'),
            @('render-report', 'report-buffs.png', 'Buffs'),
            @('render-report', 'report-buffskill.png', 'Buffs-per-skill'),
            @('render-report', 'report-support.png', 'Support'),
            @('render-report', 'report-rotation.png', 'Rotation'),
            @('render-report', 'report-timeline.png', 'Timeline'),
            @('render-report', 'report-stagger.png', 'Stagger'),
            @('render-report', 'report-defense.png', 'Defense'),
            @('render-history', 'history-nightmare.png', 'Nightmare'),
            @('render-history', 'history-bosses.png', 'Boss-fights'),
            @('render-history', 'history-bests.png', 'Personal-bests')
          )
          foreach ($s in $shots) {
            $out = Join-Path (Resolve-Path screens).Path $s[1]
            $p = Start-Process -FilePath $exe -ArgumentList (@($s[0], "`"$out`"") + $s[2..($s.Count - 1)]) -WorkingDirectory (Resolve-Path out).Path -Wait -PassThru
            "$($s[0]) $($s[2]): exit $($p.ExitCode), $(if (Test-Path $out) { (Get-Item $out).Length } else { 'no picture' })"
          }
          # The project page's pictures again at twice the pixels (sharp on high-density screens), in screens/hd.
          New-Item -ItemType Directory screens/hd | Out-Null
          $hd = @('window.png', 'compact.png', 'compact-rdps.png', 'compact-crowd.png', 'callout.png', 'bossbar.png', 'stagger.png', 'stagger-failed.png',
            'stagger-tip.png', 'dummy.png', 'find.png', 'look-wide.png', 'look-thread.png', 'look-frame.png', 'look-raidlog.png', 'look-minimal.png',
            'look-oldschool.png', 'chips.png', 'app-home.png', 'app-timers.png', 'app-bosses.png', 'app-legion.png', 'app-journey.png', 'app-characters.png',
            'app-meterlook.png', 'app-petmap.png', 'app-gather.png', 'app-cubes.png', 'app-overlays.png', 'app-history.png', 'timers-overlay.png',
            'gather-overlay.png', 'season-overlay.png', 'assist-overlays.png', 'assist-buffs.png', 'petmap-route.png',
            'petmap-route-whole-v.png', 'checklist-season.png', 'checklist-supply.png', 'details-skills.png', 'cpcalc.png', 'cpcalc-check.png',
            'report-damage.png', 'report-stagger.png', 'report-timeline.png', 'report-rotation.png', 'report-support.png', 'report-buffs.png',
            'report-healing.png', 'history-bosses.png', 'history-bests.png', 'setup-design.png', 'setup-overlays.png', 'loot.png', 'player.png')
          $env:A2H_SHOT_SCALE = '2'
          foreach ($s in ($shots | Where-Object { $hd -contains $_[1] })) {
            $out = Join-Path (Resolve-Path screens/hd).Path $s[1]
            $p = Start-Process -FilePath $exe -ArgumentList (@($s[0], "`"$out`"") + $s[2..($s.Count - 1)]) -WorkingDirectory (Resolve-Path out).Path -Wait -PassThru
            "hd $($s[0]) $($s[2]): exit $($p.ExitCode), $(if (Test-Path $out) { (Get-Item $out).Length } else { 'no picture' })"
          }
          Remove-Item Env:A2H_SHOT_SCALE
          # The app's own checks (recorded game frames, no game or Npcap needed): the result goes up with the pictures.
          $self = Start-Process -FilePath $exe -ArgumentList @('selftest') -WorkingDirectory (Resolve-Path out).Path -Wait -PassThru `
            -RedirectStandardOutput screens/selftest.txt -RedirectStandardError screens/selftest-errors.txt
          "selftest: exit $($self.ExitCode)"
          "Built from $env:GITHUB_SHA" | Set-Content screens/README.txt
      - name: Put the pictures on the screens branch
        shell: pwsh
        run: |
          cd screens
          git init -q
          git checkout -q -b screens
          git add .
          git -c user.name="screens" -c user.email="screens@users.noreply.github.com" commit -q -m "Screens for $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY" screens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
